<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Donatur</title>
    <meta name="description" content="Lihat riwayat dan daftar orang-orang baik yang telah menyalurkan donasinya untuk mendukung program yayasan Alfaruq.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .donors-count-section {
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .donors-count-text {
            font-size: 14px;
            color: #666666;
            font-weight: 400;
        }
        .donors-count-text strong {
            color: #2B7FE4;
            font-weight: 500;
        }
        .donor-card {
            padding: 15px 20px;
            background: #FFFFFF;
            border: 1px solid #EEEEEE;
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .donor-info {
            flex: 1;
        }
        .donor-info .name {
            font-size: 14px;
            font-weight: 500;
            color: #000000;
            margin-bottom: 4px;
        }
        .donor-info .donation-details {
            font-size: 12px;
            color: #666666;
        }
        .donor-info .amount {
            color: #2B7FE4;
            font-weight: 500;
        }
        .donor-info .time {
            font-size: 10px;
            color: #9CA3AF;
            margin-top: 2px;
            display: block;
        }
        .no-donors-message {
            text-align: center;
            padding: 40px 20px;
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container donors-page">
        <!-- Sticky Header -->
        <header class="detail-header">
            <a href="detail.html" id="backToDetailBtn" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            <h1>Donatur & Doa</h1>
        </header>

        <main class="detail-content content-padding">
            <section class="donors-count-section">
                <p class="donors-count-text">Melihat daftar <strong id="totalDonorsCount">0</strong> orang baik yang telah berdonasi</p>
            </section>

            <div id="donorsList">
                <div class="no-donors-message">Memuat daftar donatur...</div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const campaignId = params.get('id') || 'masjid';

            // Atur tombol kembali ke detail agar membawa ID campaign kembali
            const backBtn = document.getElementById('backToDetailBtn');
            backBtn.href = `detail.html?id=${campaignId}`;

            // Ambil nama campaign untuk judul header
            if (campaignId === 'wakaf') {
                document.querySelector('.detail-header h1').textContent = "Donatur Wakaf Al-Qur'an";
            } else {
                document.querySelector('.detail-header h1').textContent = "Donatur Pembangunan Masjid";
            }

            // Fetch daftar donatur
            fetch(`get-donors.php?campaignId=${campaignId}`)
                .then(res => res.json())
                .then(res => {
                    const donorsList = document.getElementById('donorsList');
                    const totalCountSpan = document.getElementById('totalDonorsCount');

                    if (res.status === 'success' && res.data) {
                        const donors = res.data;
                        totalCountSpan.textContent = donors.length;

                        if (donors.length > 0) {
                            donorsList.innerHTML = '';
                            donors.forEach(donor => {
                                const createdDate = new Date(donor.createdAt);
                                const timeString = formatTimeDifference(createdDate);

                                const card = document.createElement('div');
                                card.className = 'donor-card';
                                card.innerHTML = `
                                    <div class="avatar small"></div>
                                    <div class="donor-info">
                                        <p class="name">${escapeHTML(donor.name)}</p>
                                        <p class="donation-details">
                                            Berdonasi sebesar <strong class="amount">Rp${formatRupiah(donor.amount)}</strong>
                                        </p>
                                        <span class="time">${timeString}</span>
                                    </div>
                                `;
                                donorsList.appendChild(card);
                            });
                        } else {
                            donorsList.innerHTML = `
                                <div class="no-donors-message">
                                    Belum ada donasi terkumpul. Jadilah yang pertama membantu!
                                </div>
                            `;
                        }
                    } else {
                        donorsList.innerHTML = `
                            <div class="no-donors-message">Gagal memuat data donatur.</div>
                        `;
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    document.getElementById('donorsList').innerHTML = `
                        <div class="no-donors-message">Terjadi kesalahan saat memuat data.</div>
                    `;
                });
        });

        // Helper untuk mencegah XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Helper untuk format rupiah
        function formatRupiah(angka) {
            let numberString = angka.toString();
            let sisa = numberString.length % 3;
            let rupiah = numberString.substr(0, sisa);
            let ribuan = numberString.substr(sisa).match(/\d{3}/g);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            return rupiah;
        }

        // Helper untuk format perbedaan waktu
        function formatTimeDifference(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 1) return 'Baru saja';
            if (diffMins < 60) return `${diffMins} menit yang lalu`;
            if (diffHours < 24) return `${diffHours} jam yang lalu`;
            return `${diffDays} hari yang lalu`;
        }
    </script>
</body>
</html>
